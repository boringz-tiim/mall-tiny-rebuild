server:
  port: 8080
spring:
  application:
    name: mall-tiny
  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:2h}